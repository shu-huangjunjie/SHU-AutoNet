[package]
name = "shu-autonet"
version = "1.0.0"
description = "Shanghai University Campus Network Auto Authenticator"
authors = ["huangjunjie"]
edition = "2021"
license = "MIT"

[lib]
name = "shu_autonet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
regex = "1.10"
url = "2.5"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tauri = { version = "2.0.0", features = ["test"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
